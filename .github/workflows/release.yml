# Publishes a release for Issue #7: a pair of arm64 images tagged with the Git
# commit that produced them, so a running release can always be identified from
# its image tag and an earlier release can be restored without rebuilding.
#
# Runs when CI succeeds for a push to main, and publishes the commit CI
# verified. A failing check therefore blocks every release.
#
# Nothing is deployed from here. The development host is updated by hand
# (deploy/development/RUNBOOK.md) and the presentation stack from an engineer's
# machine (infra/RUNBOOK.md), because an automatic deploy is a cost risk (#20).
# Authentication uses GitHub OIDC, so the repository holds no long-lived AWS
# credentials.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

# One publish at a time, never cancelled half-way.
concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY_API: cartoptix-api
  ECR_REPOSITORY_WEB: cartoptix-web
  # The commit CI verified.
  RELEASE: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Build and publish arm64 images
    # Checks gate every release. Only a successful CI run for a push to main
    # starts a publish; a pull request can never publish.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # Native arm64, so the images are built for Graviton without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check the required repository variables
        env:
          PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
        run: |
          if [[ -z "$PUBLISH_ROLE_ARN" ]]; then
            echo "::error::Repository variable AWS_PUBLISH_ROLE_ARN is not set. See deploy/development/RUNBOOK.md."
            exit 1
          fi

      - name: Check out the commit CI verified
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE }}
          # The images are published from the checkout, not pushed back to it.
          persist-credentials: false

      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          # Only the commit tag is published. Never a moving tag such as
          # "latest": the tag must identify exactly one immutable build.
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.RELEASE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Publish the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/development/web.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.RELEASE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Record the release
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          {
            echo "Published release \`$RELEASE\`"
            echo
            echo '```'
            echo "$REGISTRY/$ECR_REPOSITORY_API:$RELEASE"
            echo "$REGISTRY/$ECR_REPOSITORY_WEB:$RELEASE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

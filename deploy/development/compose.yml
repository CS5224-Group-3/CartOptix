# CartOptix development POC.
#
# Every service runs a published image. Nothing is built on this host: CI builds
# and publishes the arm64 images, tagged with the Git commit that produced them
# (.github/workflows/publish.yml). The host only pulls.
#
# IMAGE_REGISTRY and RELEASE must be set, normally by deploy/development/.env.
# RELEASE is the commit SHA of the running release, so the containers identify
# exactly which build they are running. See RUNBOOK.md for the release and
# rollback procedures.

services:
  postgres:
    image: postgres:18-alpine
    container_name: cartoptix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cartoptix-postgres-data:/var/lib/postgresql
    networks:
      - cartoptix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/cartoptix-api:${RELEASE:?RELEASE is required}
    container_name: cartoptix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - cartoptix-net
    labels:
      com.cartoptix.release: ${RELEASE}
      com.cartoptix.component: api
    healthcheck:
      # Liveness, not readiness: this only has to answer "is the API process
      # serving?", and the image is node:24-slim, which has no curl or wget.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health/live')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/cartoptix-web:${RELEASE:?RELEASE is required}
    container_name: cartoptix-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # WEB_PORT exists so a development machine can put the stack on a spare
      # port when 80 is already taken. The host uses the default.
      - "${WEB_PORT:-80}:80"
    networks:
      - cartoptix-net
    labels:
      com.cartoptix.release: ${RELEASE}
      com.cartoptix.component: web
    healthcheck:
      # nginx:alpine is BusyBox based, so use only the short wget options it
      # always has rather than the GNU long forms or --spider.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-off tasks. They are in the "ops" profile because a release runs each of
  # them exactly once, from the released image, rather than on every instance or
  # on every start. Readiness deliberately does not check the seed, so the
  # import is a release step: see RUNBOOK.md.
  migrate:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/cartoptix-api:${RELEASE:?RELEASE is required}
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "apps/api/dist/db/migrate-cli.js"]
    networks:
      - cartoptix-net

  seed:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/cartoptix-api:${RELEASE:?RELEASE is required}
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command:
      ["node", "apps/api/dist/seed/import-cli.js", "/seed/seed.json"]
    volumes:
      - ../../data/seed/seed.json:/seed/seed.json:ro
    networks:
      - cartoptix-net

volumes:
  cartoptix-postgres-data:
    external: true

networks:
  cartoptix-net:
    external: true
